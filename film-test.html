<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"><title>بررسی فریم‌های کافه معدن</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#fff;color:#23292a;margin:0;padding:30px 18px;line-height:2}.wrap{max-width:760px;margin:auto}h1{font-size:24px}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}.item{padding:12px;border:1px solid #dadada;border-radius:15px}.item img{width:100%;height:200px;object-fit:cover;background:#eee}.ok{color:#087b4e}.bad{color:#b21d18}code{direction:ltr;unicode-bidi:embed;word-break:break-all;font-size:12px}.note{background:#f4f4f4;padding:12px;border-radius:10px}</style></head><body><main class="wrap"><h1>تست بارگذاری تصاویر اسکرولی روی دامنه منتشرشده</h1><p>همه پنج تصویر باید نمایش داده شوند و عبارت «سالم» زیرشان قرار گیرد.</p><div class="list" id="results"></div><p class="note">اگر یکی از موارد خطا دارد، یعنی آن تصویر روی دامنه در دسترس نیست؛ پوشه <code>assets/scrollframes</code> را در خروجی Deploy بررسی کنید.</p><p><a href="/">بازگشت به صفحه اصلی</a></p></main><script>for(const i of [0,25,50,75,99]){const s=String(i).padStart(3,'0');const u='/assets/scrollframes/frame-'+s+'.webp';const el=document.createElement('article');el.className='item';const title=document.createElement('b');title.textContent='فریم '+s;const im=document.createElement('img');im.alt='فریم '+s;const result=document.createElement('div');result.textContent='در حال دریافت...';im.onload=()=>{result.className='ok';result.textContent='سالم ✓';};im.onerror=()=>{result.className='bad';result.textContent='خطا در بارگذاری ✕';};im.src=u;el.append(title,im,result);document.getElementById('results').append(el)}</script></body></html>
